# ccswm.org — complete per-site stack: PVC, Deployment, Service, Ingress,
# backup CronJob.
#
# The load-bearing constraint throughout: bytdb is an EMBEDDED engine — the
# site process is the one and only writer of /data/church.db. That forces:
#   - replicas: 1 (two pods would corrupt the file)
#   - strategy: Recreate (RollingUpdate would briefly run old+new pods, and
#     the RWO block-storage volume can't attach to two nodes anyway)
#   - ReadWriteOnce block storage for the live file. Never object storage:
#     the WAL needs honest fsync, which S3-compatible stores can't give.
#     Object storage is the BACKUP target only (see the CronJob).
#
# Secrets expected in the `churches` namespace (created out-of-band, never
# committed — `deploy/deploy.sh secrets` builds both):
#   ccswm-config   keys `options.yml` AND `random_seeds.txt` — BOTH required;
#                  the app cannot start without the seeds file (see below)
#   ccswm-backup   keys OBJ_ENDPOINT, OBJ_REGION, OBJ_BUCKET, OBJ_ACCESS_KEY,
#                  OBJ_SECRET_KEY, BACKUP_TOKEN
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ccswm-data
  namespace: churches
spec:
  # `-retain` variant: deleting the PVC (or the whole site stack) leaves the
  # underlying Linode volume — and the database in it — intact. Recovery from
  # a fat-fingered `kubectl delete` is reattachment, not backup restore.
  storageClassName: linode-block-storage-retain
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi # Linode block storage minimum; church DBs are MBs, so this never grows
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ccswm
  namespace: churches
  labels: {app: ccswm}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: ccswm}
  template:
    metadata:
      labels: {app: ccswm}
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000 # block-storage volumes mount root-owned; fsGroup makes /data writable by the app user, and the config Secret group-readable
      # RETIRED: seed-or-restore now happens in-app, in db/replicate.go, before
      # the engine opens the file. The move buys three things the initContainer
      # could not: it prefers the seconds-stale WAL replica over the hour-stale
      # latest/ snapshot, it FAILS the boot when the store is reachable but the
      # restore errors (mc's `|| echo` swallowed that, and an empty site serving
      # 200s is worse than a crash-looping pod), and it is unit-tested. It also
      # drops a third-party image out of the boot path.
      #
      # Kept commented for one release as the documented manual escape hatch:
      # if a WAL generation is ever certified-complete-but-missing-chunks, the
      # app aborts on purpose, and the operator recovers by putting a file on
      # the volume by hand — after which the in-app restore sees it and stands
      # down. Same command, run once:
      #
      #   kubectl -n churches run restore --rm -it --image=minio/mc:latest -- \
      #     sh -c 'mc alias set obj ... && mc cp obj/$BUCKET/ccswm/latest/church.db /data/church.db'
      #
      # initContainers:
      #   - name: restore-if-empty
      #     image: minio/mc:latest
      #     command: ["/bin/sh", "-c"]
      #     args:
      #       - |
      #         if [ -f /data/church.db ]; then
      #           echo "database present - skipping restore"
      #           exit 0
      #         fi
      #         mc alias set obj "https://${OBJ_ENDPOINT}" "${OBJ_ACCESS_KEY}" "${OBJ_SECRET_KEY}"
      #         mc cp "obj/${OBJ_BUCKET}/ccswm/latest/church.db" /data/church.db \
      #           && echo "restored from object storage" \
      #           || echo "no backup found - starting fresh (schema bootstrap will run)"
      #     envFrom:
      #       - secretRef: {name: ccswm-backup}
      #     volumeMounts:
      #       - {name: data, mountPath: /data}
      containers:
        - name: ccswm
          image: ghcr.io/rohanthewiz/ccswm:latest # pin a tag/digest for real deploys; deploy.sh passes the git SHA
          workingDir: /app # config loads from CWD-relative cfg/options.yml
          env:
            # WITHOUT THIS the process reads the `development:` section of
            # options.yml: config.InitConfig defaults AppEnv to "development"
            # when APP_ENV is unset, and buildTLSCfg() additionally
            # short-circuits on that value. Production config in a pod running
            # as development is the kind of thing that looks fine until a
            # credential or a domain differs between sections.
            - {name: APP_ENV, value: production}
            # Listener shape is owned by this file, not by options.yml, because
            # containerPort / Service targetPort / probes below all have to name
            # the same port. The sites' own production sections are written for
            # bare metal (cema: 8088; ccswm sample: 80 + use_tls with certbot
            # paths), and these overrides let those stay as the non-k8s story.
            # TLS terminates at the ingress, which also owns the ACME challenge,
            # so the app must serve plain HTTP here.
            - {name: SERVER_PORT, value: "4000"}
            - {name: USE_TLS, value: "false"}
            # Env overrides (config/env_overrides.go) beat options.yml, so the
            # DB location is pinned here where the volume mount is defined,
            # keeping the two in one file. bytdb is already the default type.
            - {name: DB_TYPE, value: bytdb}
            - {name: DB_FILE, value: /data/church.db}
            # Site's key prefix in the shared backup bucket (→ ccswm/<ts>/church.db)
            - {name: BACKUP_PREFIX, value: ccswm}
            # Continuous WAL shipping → ccswm/wal/gen/... Cuts RPO from 1h
            # (the CronJob below) to ~5s. Opt-in per site and reversible:
            # setting this to "false" stops shipping, and generations already
            # in the bucket stay restorable. Same bucket and credentials as the
            # snapshots — identical blast radius, disjoint key namespaces.
            - {name: BACKUP_REPLICATE, value: "true"}
          # OBJ_* destination + BACKUP_TOKEN: the app now performs both the
          # snapshot (resource/dbbackup) and the WAL shipping + cold-start
          # restore (db/replicate.go), so it needs the same secret the CronJob
          # uses — one secret, two consumers. OBJ_REGION must be in there and
          # must match the bucket's actual region: both S3 clients default it
          # to us-east-1, and a wrong region fails SigV4 signing in a way that
          # only shows up as a logged error — backups and WAL shipping stop
          # while the site keeps serving happily.
          envFrom:
            - secretRef: {name: ccswm-backup}
          ports:
            - {name: http, containerPort: 4000}
          volumeMounts:
            - {name: data, mountPath: /data}
            # Admin-uploaded article images. resource/chimage writes them to
            # the CWD-relative "dist/img/" and pages reference them as
            # /assets/img/... — so without this mount every upload lives in the
            # container's writable layer and every redeploy silently breaks the
            # images in existing articles. Backed by a subdirectory of the same
            # block volume rather than a second PVC: one device, one $1/mo,
            # nothing extra to attach.
            # NOTE: unlike the database, these files are NOT shipped to object
            # storage. Their protection is the `-retain` storage class plus
            # Linode volume snapshots — see README.
            - {name: data, mountPath: /app/dist/img, subPath: uploads}
            # The WHOLE cfg directory, not a single-file subPath: the app needs
            # two files from this Secret, and the second one is not optional.
            # resource/auth's init() opens cfg/random_seeds.txt and log.Fatal()s
            # if it is missing — that runs before main(), so an incomplete
            # Secret here is an unconditional crash loop with a one-line error.
            - {name: config, mountPath: /app/cfg, readOnly: true}
          # Probes hit /healthz (router_rweb.go): no session middleware, no DB
          # query, no page render. Pointing them at "/" cost a full home-page
          # build every tick and, worse, made "the DB is briefly slow" look
          # identical to "the process is wedged" — a liveness restart loop.
          #
          # startupProbe is the one that matters for disaster recovery: on an
          # empty volume the app restores from object storage BEFORE it binds a
          # port, under a timeout of up to 2 minutes. Liveness with the old
          # 15s initial delay would have killed the pod mid-restore, repeatedly,
          # exactly when recovery was the point. 30 × 5s = 150s of headroom, and
          # liveness/readiness stay parked until it passes.
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi} # no CPU limit: avoid throttling bursts (page builds); memory bounds the embedded engine
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: ccswm-data}
        - name: config
          secret:
            secretName: ccswm-config
            # 0440 + fsGroup 1000 above: readable by the app's group, not by
            # anything else that might land in the pod.
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: ccswm
  namespace: churches
spec:
  selector: {app: ccswm}
  ports:
    - {name: http, port: 4000, targetPort: http}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ccswm
  namespace: churches
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Admin uploads (images via the editor) exceed nginx's 1m default
    nginx.ingress.kubernetes.io/proxy-body-size: 64m
    # Server-Sent Events: /chat/stream (live chat + prayer wall, and the same
    # endpoint the mobile app consumes). ingress-nginx defaults would break it
    # two separate ways — response buffering holds events until the buffer
    # fills, and the 60s read timeout drops an idle stream every minute. Both
    # present as "chat works locally but not in production".
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [ccswm.org, www.ccswm.org]
      secretName: ccswm-tls # cert-manager materializes this
  rules:
    # Host-based routing is what makes multi-domain work: every site shares
    # the one ingress-nginx NodeBalancer, and nginx fans out by Host header.
    - host: ccswm.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: ccswm, port: {name: http}}
    - host: www.ccswm.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: ccswm, port: {name: http}}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ccswm-backup
  namespace: churches
spec:
  # Hourly full backup — the SNAPSHOT tier. In-app WAL shipping
  # (BACKUP_REPLICATE above) is now the primary tier at RPO ~5s, and this
  # stays as the independent second one: it is produced by different code
  # through a different client from a different mechanism, so it survives a
  # bug in the WAL chain, and latest/ remains how a migrated database is
  # delivered to a new site.
  schedule: "7 * * * *" # :07 offset — stagger sites so backups don't stampede
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      template:
        spec:
          restartPolicy: Never
          containers:
            # The CronJob cannot copy the live file itself — only the engine
            # can produce a consistent snapshot (Engine.BackupTo). So it asks
            # the app to do it: POST to the in-app backup endpoint, which
            # snapshots and uploads to object storage, then rotates `latest`.
            - name: trigger-backup
              image: curlimages/curl:8.10.1
              command: ["/bin/sh", "-c"]
              args:
                - |
                  curl --fail-with-body -sS -X POST \
                    -H "Authorization: Bearer ${BACKUP_TOKEN}" \
                    http://ccswm.churches.svc.cluster.local:4000/api/admin/db/backup
              env:
                - name: BACKUP_TOKEN
                  valueFrom:
                    secretKeyRef: {name: ccswm-backup, key: BACKUP_TOKEN}
              resources:
                requests: {cpu: 10m, memory: 16Mi}
                limits: {memory: 64Mi}
